name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fajr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fajr"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FAJR_ENV: development
      FAJR_DATABASE_URL: postgres://fajr_app:fajr@localhost:5432/fajr?sslmode=disable
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fajr?sslmode=disable
      FAJR_S3_ENDPOINT: localhost:9000
      FAJR_S3_ACCESS_KEY: fajr
      FAJR_S3_SECRET_KEY: fajrsecret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.27', cache: true }
      # A service container cannot override the entrypoint MinIO needs.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=fajr -e MINIO_ROOT_PASSWORD=fajrsecret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1
      - run: psql "$ADMIN_DATABASE_URL" -f db/init/01-app-role.sql
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go run ./cmd/migrate up
      - run: go test ./... -race -count=1
