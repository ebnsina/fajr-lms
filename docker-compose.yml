services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fajr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fajr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
